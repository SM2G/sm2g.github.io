services_title:
  fr: Ce que je fais
  en: What I do
  he: מה אני עושה

services:
  - icon: cloud
    title:
      fr: Cloud AWS & Azure
      en: Cloud AWS & Azure
      he: ענן AWS ו‑Azure
    text:
      fr: Architecture, suivi de projet avec **Jira**, migration Cloud de solutions existantes. <br /><br />Maîtrise des coûts avec des règles de tagging, création de dashboards et optimisation de charge. 
      en: Architecture, project tracking with **Jira**, and cloud migration of existing solutions.<br /><br />Cost control through tagging rules, dashboards and workload optimization.
      he: ארכיטקטורה, מעקב פרויקטים עם **Jira**, והגירה לענן של פתרונות קיימים.<br /><br />בקרת עלויות באמצעות כללי תיוג (tagging), בניית דשבורדים ואופטימיזציית עומסים.
  - icon: code
    title:
      fr: CI/CD & Infrastructure as Code
      en: CI/CD & Infrastructure as Code
      he: CI/CD ו‑Infrastructure as Code
    text:
      fr: Pipelines de déploiement et infrastructure versionnée avec **Terraform** ou **OpenTofu**.<br /><br />Automatisation de workflows via **GitHub Actions** ou **GitLab CI**.
      en: Deployment pipelines and versioned infrastructure with **Terraform** or **OpenTofu**.<br /><br />Workflow automation via **GitHub Actions** or **GitLab CI**.
      he: Pipelines של פריסה ותשתית מנוהלת בקוד עם **Terraform** או **OpenTofu**.<br /><br />אוטומציה של תהליכים באמצעות **GitHub Actions** או **GitLab CI**.
  - icon: pulse
    title:
      fr: Fiabilité & observabilité
      en: Reliability & observability
      he: אמינות ו‑Observability
    text:
      fr: Supervision, alerting avec **Datadog**, **Grafana**.<br />Gestion d'incident avec CloudTrail, CloudWatch.<br />Définition de SLOs.
      en: Monitoring and alerting with **Datadog** and **Grafana**.<br />Incident management with CloudTrail and CloudWatch.<br />Definition of SLOs.
      he: ניטור והתראות עם **Datadog** ו‑**Grafana**.<br />ניהול אירועים עם CloudTrail ו‑CloudWatch.<br />הגדרת SLOs.
  - icon: database
    title:
      fr: Bases de données
      en: Databases
      he: מסדי נתונים
    text:
      fr: Administration, performance, sauvegardes et haute disponibilité.<br /><br />6 ans d'expérience en tant que DBA sur Oracle, Postgres en production sur de fortes volumétries.<br />Secteur bancaire et e-commerce.
      en: Administration, performance, backups and high availability.<br /><br />6 years of experience as a DBA on Oracle and Postgres in high-volume production environments.<br />Banking and e-commerce sectors.
      he: ניהול, ביצועים, גיבויים וזמינות גבוהה.<br /><br />6 שנות ניסיון כ‑DBA על Oracle ו‑Postgres בסביבות ייצור עתירות נפח נתונים.<br />בתחומי הבנקאות והמסחר האלקטרוני.
  - icon: shield
    title:
      fr: Sécurité
      en: Security
      he: אבטחה
    text:
      fr: DevSecOps, gestion des identités avec IAM et audit des accès. Durcissement automatisé des rôles IAM. Mise en place de services SSO.
      en: DevSecOps, identity management with IAM and access auditing. Automated hardening of IAM roles. Implementation of SSO services.
      he: DevSecOps, ניהול זהויות באמצעות IAM וביקורת גישות. הקשחה אוטומטית של תפקידי IAM. הטמעת שירותי SSO.
  - icon: graduation
    title:
      fr: Formation
      en: Training
      he: הדרכה
    text:
      fr: 3 ans d'expérience en tant que Team Lead avec montée en charge jusqu'à **6 DevOps**. <br /><br />Mentorat et création de cursus pédagogiques.<br />Formateur en administration de bases de données Oracle pendant 3 ans, une année d'enseignement dispensée en Chine.<br /><br />Speaker lors de conférences Blockchain et Web3 entre 2017-2019. 
      en: 3 years of experience as a Team Lead, scaling up to **6 DevOps engineers**.<br /><br />Mentoring and curriculum design.<br />Oracle database administration trainer for 3 years, including one year of teaching in China.<br /><br />Speaker at Blockchain and Web3 conferences between 2017 and 2019.
      he: 3 שנות ניסיון כ‑Team Lead, עם הרחבת הצוות עד **6 אנשי DevOps**.<br /><br />חונכות ובניית תכניות לימוד.<br />מדריך בניהול מסדי נתונים Oracle במשך 3 שנים, מתוכן שנת הוראה אחת בסין.<br /><br />מרצה בכנסי Blockchain ו‑Web3 בין 2017 ל‑2019.

