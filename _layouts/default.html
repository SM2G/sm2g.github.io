{%- assign c = site.data.content -%}
<!doctype html>
<html lang="{{ c.languages[0].code }}" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
<meta name="theme-color" content="#b08d57">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
<script>
  // Applied before paint to avoid a flash of the wrong theme / language
  var LANGS = [{% for l in c.languages %}'{{ l.code }}'{% unless forloop.last %}, {% endunless %}{% endfor %}];
  var RTL = [{% for l in c.languages %}{% if l.rtl %}'{{ l.code }}',{% endif %}{% endfor %}];
  function setLang(l) { var d = document.documentElement; d.lang = l; d.dir = RTL.indexOf(l) < 0 ? 'ltr' : 'rtl'; }
  (function () {
    var s = {}, nav = (navigator.language || '').slice(0, 2).toLowerCase();
    try { s = localStorage; } catch (e) {}
    document.documentElement.dataset.theme = s.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    setLang(LANGS.indexOf(s.lang) >= 0 ? s.lang : LANGS.indexOf(nav) >= 0 ? nav : 'en');
  })();
</script>
<style>
{% for l in c.languages %}html:not([lang="{{ l.code }}"]) [lang="{{ l.code }}"]{% unless forloop.last %}, {% endunless %}{% endfor %} { display: none; }
{% for l in c.languages %}html[lang="{{ l.code }}"] [data-l="{{ l.code }}"]{% unless forloop.last %}, {% endunless %}{% endfor %} { color: var(--on-accent); background: var(--accent-fill); }
{% include style.css %}
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <a class="mono" href="{{ '/' | relative_url }}" aria-label="{{ c.name }}">SG</a>
    <div class="tools">
      <div class="tool langs" role="group" aria-label="Language">
        {% for l in c.languages %}<button data-l="{{ l.code }}">{{ l.label }}</button>{% endfor %}
      </div>
      <button class="tool" id="theme" aria-label="Light / dark theme">
        <span class="sun">{% include icon.html name="sun" %}</span><span class="moon">{% include icon.html name="moon" %}</span>
      </button>
    </div>
  </div>

  {{ content }}

  <footer>
    <nav>
      {% for link in c.links %}
      <a href="{{ link.url }}" target="_blank" rel="noopener">{% include icon.html name=link.icon %}{{ link.label }}</a>
      {% endfor %}
    </nav>
    <p>© {{ site.time | date: '%Y' }} {{ c.name }}</p>
  </footer>

</div>
<script>
  function save(k, v) { try { localStorage[k] = v; } catch (e) {} }
  document.getElementById('theme').onclick = function () {
    var d = document.documentElement;
    save('theme', d.dataset.theme = d.dataset.theme === 'dark' ? 'light' : 'dark');
  };
  document.querySelectorAll('[data-l]').forEach(function (b) {
    b.onclick = function () { setLang(b.dataset.l); save('lang', b.dataset.l); };
  });
  // Keep the "years of experience" figure current between site rebuilds
  document.querySelectorAll('.years').forEach(function (el) {
    var s = new Date(el.dataset.since), n = new Date(), y = n.getFullYear() - s.getFullYear();
    if (n.getMonth() < s.getMonth() || (n.getMonth() === s.getMonth() && n.getDate() < s.getDate())) y--;
    if (y >= 0) el.textContent = y;
  });
</script>
</body>
</html>
